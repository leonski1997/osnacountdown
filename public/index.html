<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wieder in Osnabrück</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#2d4a35">
  <style>
    :root {
      --bg-start: #c9e4cd; --bg-end: #eef7ef;
      --text: #2d4a35; --accent-bg: #2d4a35;
      --card: rgba(255,255,255,0.85); --card-strong: rgba(255,255,255,0.92);
      --shadow-soft: rgba(45,74,53,0.2);
    }
    body.dark {
      --bg-start: #16261b; --bg-end: #0a120c;
      --text: #d7ead9; --accent-bg: #3f6b4c;
      --card: rgba(25,42,30,0.75); --card-strong: rgba(25,42,30,0.85);
      --shadow-soft: rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 90px;
      transition: background 0.3s ease;
    }
    .box {
      background: var(--card);
      padding: 24px 30px;
      border-radius: 18px;
      max-width: 90vw;
      width: 380px;
      box-shadow: 0 4px 16px var(--shadow-soft);
      position: relative;
      transition: background 0.3s ease, padding 0.3s ease;
    }
    #box-toggle {
      position: absolute; top: 10px; right: 14px; cursor: pointer;
      font-size: 1.1em; color: white; user-select: none; z-index: 5;
      background: var(--accent-bg); width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    #box-toggle-label {
      display: none; background: var(--accent-bg); color: white;
      padding: 10px 22px; border-radius: 12px; font-weight: bold; font-size: 0.95em; cursor: pointer;
    }
    .box.eingeklappt {
      background: var(--card-strong);
      padding: 10px 16px;
      min-height: 48px; min-width: 140px;
      display: flex; align-items: center; justify-content: center;
    }
    .box.eingeklappt #box-inhalt { display: none; }
    .box.eingeklappt #box-toggle { display: none; }
    .box.eingeklappt #box-toggle-label { display: inline-block; }
    h1 { font-size: 3em; margin: 0 0 4px 0; }
    .fortschritt-container {
      background: rgba(150,150,150,0.3);
      border-radius: 10px;
      height: 14px;
      margin: 16px 0 6px 0;
      overflow: hidden;
    }
    .fortschritt-bar {
      background: var(--accent-bg);
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }
    .fortschritt-text { font-size: 0.85em; opacity: 0.8; margin: 0 0 14px 0; }
    .spruch { font-style: italic; margin: 10px 0; }
    .ferien { font-size: 0.9em; opacity: 0.85; }

    #modus-button {
      position: fixed; top: 14px; right: 14px;
      background: var(--card-strong); border-radius: 50%;
      width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.2em; box-shadow: 0 2px 8px var(--shadow-soft);
    }

    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-strong);
      display: flex; justify-content: space-around; padding: 10px 0;
      box-shadow: 0 -2px 10px var(--shadow-soft);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; font-size: 0.75em; color: var(--text);
      padding: 6px 16px; border-radius: 12px;
    }
    .nav-item.aktiv { background: rgba(150,150,150,0.2); font-weight: bold; }
    .nav-item .icon { font-size: 1.5em; }

    .hidden { display: none !important; }
    .screen.hidden { display: none; }

    .frage-button {
      display: inline-block; background: var(--accent-bg); color: white;
      text-decoration: none; border: none; padding: 14px 28px; margin: 8px;
      border-radius: 12px; font-size: 1.25em; cursor: pointer; font-family: Arial, sans-serif;
    }
    .frage-button:disabled { opacity: 0.5; cursor: default; }
    .streak-flammen { font-size: 1.4em; margin: 0 0 2px 0; }
    .streak-anzeige { font-weight: bold; margin: 0 0 12px 0; }
    .ergebnis-zeile { display: flex; justify-content: space-between; padding: 6px 0; }
    .zurueck-link { display: block; margin-top: 14px; font-size: 0.85em; opacity: 0.75; cursor: pointer; }

    .konfetti-teil {
      position: fixed; top: -20px; pointer-events: none; z-index: 3000;
      animation-name: fallen-rotieren; animation-timing-function: ease-in; animation-fill-mode: forwards;
    }
    @keyframes fallen-rotieren { to { transform: translateY(115vh) rotate(360deg); opacity: 0.3; } }
    .deko-partikel {
      position: fixed; top: -20px; border-radius: 50%; opacity: 0.85; pointer-events: none; z-index: 2000;
      animation-name: fallen; animation-timing-function: linear; animation-fill-mode: forwards;
    }
    @keyframes fallen { to { transform: translateY(115vh); opacity: 0.3; } }
    .funke-partikel {
      position: fixed; bottom: 80px; border-radius: 50%; pointer-events: none; z-index: 2000;
      animation-name: aufsteigen; animation-timing-function: ease-out; animation-fill-mode: forwards;
      box-shadow: 0 0 8px currentColor;
    }
    @keyframes aufsteigen { to { transform: translateY(-70vh); opacity: 0; } }

    .box.spezialtag-valentinstag { border: 2px solid #c2185b; }
    .box.spezialtag-weihnachten { border: 2px solid #b71c1c; }
    .box.spezialtag-jahrestag { border: 2px solid #b8860b; box-shadow: 0 0 20px rgba(184,134,11,0.5); }
    .box.spezialtag-unterrichtsbesuch { border: 2px solid #2e6f95; }
    .box.wochenende { border: 2px dashed rgba(150,150,150,0.6); }
    .meilenstein-zahl { animation: pulsieren 1.4s ease-in-out infinite; }
    @keyframes pulsieren { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); color: gold; } }

    #user-header {
      position: fixed; top: 14px; left: 14px;
      background: var(--card-strong); border-radius: 14px; padding: 8px 14px;
      font-size: 0.85em; display: flex; gap: 10px; align-items: center;
      box-shadow: 0 2px 8px var(--shadow-soft);
    }
    #user-header.hidden { display: none; }
    #user-header a { color: var(--text); text-decoration: underline; cursor: pointer; }

    .statistik-box {
      background: var(--card-strong); border-radius: 18px; padding: 22px 24px;
      max-width: 90vw; width: 380px; margin: 0 auto 16px auto; color: var(--text);
      box-shadow: 0 4px 16px var(--shadow-soft);
    }
    .statistik-titel { font-size: 0.95em; font-weight: bold; opacity: 0.85; margin: 0 0 12px 0; }
    .statistik-zahl-gross { font-size: 2.6em; font-weight: bold; margin: 0; }
    .statistik-zeile { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--shadow-soft); font-size: 0.95em; }
    .statistik-zeile:last-child { border-bottom: none; }
    .statistik-zeile b { color: var(--accent-bg); }

    .historie-monat { font-weight: bold; margin: 16px 0 6px 0; cursor: pointer; }
    .historie-eintrag { padding: 6px 0; border-bottom: 1px solid rgba(150,150,150,0.2); font-size: 0.9em; text-align: left; }

    #briefe-liste { max-height: 50vh; overflow-y: auto; text-align: left; margin-bottom: 6px; }
    .brief-blase {
      max-width: 75%; padding: 8px 12px; border-radius: 12px; margin: 6px 0;
      font-size: 0.95em; word-wrap: break-word;
    }
    .brief-eigen { background: var(--accent-bg); color: white; margin-left: auto; }
    .brief-partner { background: rgba(150,150,150,0.25); }
    .brief-zeit { font-size: 0.7em; opacity: 0.7; margin-top: 2px; }

    #gedanke-toast {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: var(--accent-bg); color: white; padding: 12px 24px;
      border-radius: 14px; font-weight: bold; z-index: 500;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35); max-width: 85vw; text-align: center;
    }
    #gedanke-toast.hidden { display: none; }
  </style>
</head>
<body>

  <div id="modus-button">🖥️</div>
  <div id="gedanke-toast" class="hidden"></div>

  <div id="user-header" class="hidden">
    <span id="user-name-label"></span>
    <a id="ausloggen-link" href="#">Ausloggen</a>
  </div>

  <div id="screen-identitaet" class="screen hidden">
    <div class="box">
      <h2>Wer bist du?</h2>
      <button class="frage-button" id="identitaet-leon-button">Leon</button>
      <button class="frage-button" id="identitaet-lotta-button">Lotta</button>
    </div>
  </div>

  <div id="screen-countdown" class="screen">
    <div class="box" id="countdown-box">
      <div id="box-toggle">▾</div>
      <div id="box-inhalt">
        <p id="online-status" class="hidden" style="color:#4caf50; font-weight:bold; margin-bottom:8px;">🟢 ist gerade auch da</p>
        <h1 id="countdown-zahl">-</h1>
        <p>Tage bis wir wieder zusammen sind ❤️</p>
        <p id="countdown-wochen"></p>
        <div class="fortschritt-container"><div class="fortschritt-bar" id="fortschritt-bar"></div></div>
        <p class="fortschritt-text" id="fortschritt-text"></p>
        <p class="spruch" id="spruch-text"></p>
        <p class="ferien" id="ferien-text"></p>
        <button class="frage-button" id="gedanke-button" style="margin-top:14px;">Ich denk an dich ❤️</button>
      </div>
      <span id="box-toggle-label">Einblenden</span>
    </div>
  </div>

  <div id="screen-abstimmung" class="screen hidden">
    <div class="box">
      <div id="abstimmung-inhalt"><p>Lädt...</p></div>
      <a class="zurueck-link" id="link-historie">📜 Historie ansehen</a> &nbsp;|&nbsp;
      <a class="zurueck-link" id="link-statistik" style="display:inline;">📊 Statistik ansehen</a>
    </div>
  </div>

  <div id="screen-historie" class="screen hidden">
    <div class="box" style="width: 90vw; max-width: 500px; max-height: 75vh; overflow-y: auto;">
      <div id="historie-inhalt"><p>Lädt...</p></div>
      <a class="zurueck-link" onclick="document.getElementById('nav-abstimmung').click()">← Zurück</a>
    </div>
  </div>

  <div id="screen-statistik" class="screen hidden">
    <div id="statistik-inhalt"><p>Lädt...</p></div>
    <a class="zurueck-link" onclick="document.getElementById('nav-abstimmung').click()" style="text-align:center;">← Zurück</a>
  </div>

  <div id="screen-briefe" class="screen hidden">
    <div class="box" style="width: 90vw; max-width: 500px;">
      <div id="briefe-liste"></div>
      <div style="display:flex; gap:6px; margin-top:10px;">
        <input type="text" id="brief-eingabe" placeholder="Nachricht schreiben..." style="flex:1; padding:10px; border-radius:10px; border:none;">
        <button id="brief-senden-button" class="frage-button" style="width:auto; margin:0;">Senden</button>
      </div>
    </div>
  </div>

  <div id="bottom-nav">
    <div class="nav-item aktiv" id="nav-countdown"><span class="icon">📅</span>Countdown</div>
    <div class="nav-item" id="nav-abstimmung"><span class="icon">🗳️</span>Frage</div>
    <div class="nav-item" id="nav-briefe"><span class="icon">💌</span>Chat</div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = window.__FIREBASE_CONFIG__ || { projectId: "osnacountdown" };
    // window.__FIREBASE_CONFIG__ wird aus einer separaten Datei geladen (siehe unten im HTML),
    // damit die eigentlichen Zugangsdaten nicht mitten im Code stehen müssen.

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    var istAngemeldet = false;

    var anmeldungFehlgeschlagen = false;
    signInAnonymously(auth).catch(function (e) {
      console.error('Anmeldung fehlgeschlagen:', e);
      anmeldungFehlgeschlagen = true;
      var container = document.getElementById('abstimmung-inhalt');
      if (container) {
        container.innerHTML = '<p>⚠️ Verbindung zur Datenbank fehlgeschlagen.<br>(' + e.code + ')</p>';
      }
    });
    onAuthStateChanged(auth, function (user) {
      istAngemeldet = !!user;
      if (user && document.getElementById('screen-abstimmung').classList.contains('hidden') === false) {
        ladeAbstimmung();
      }
      if (user) { pruefeGedanke(); }
    });

    // ---------- Identität (wie in der alten App: ?user=leon / ?user=lotta + localStorage) ----------
    var urlParams = new URLSearchParams(window.location.search);
    var meinUser = urlParams.get('user') || localStorage.getItem('meinUser') || null;
    if (urlParams.get('user')) { localStorage.setItem('meinUser', meinUser); }

    function setzeIdentitaet(user) {
      meinUser = user;
      localStorage.setItem('meinUser', user);
      zeigeAppNachIdentitaet();
      pruefeGedanke();
      sendeHerzschlag();
      pruefeOnlineStatus();
    }

    function zeigeAppNachIdentitaet() {
      var nav = document.getElementById('bottom-nav');
      if (!meinUser) {
        document.getElementById('screen-identitaet').classList.remove('hidden');
        document.getElementById('user-header').classList.add('hidden');
        document.getElementById('screen-countdown').classList.add('hidden');
        document.getElementById('screen-abstimmung').classList.add('hidden');
        document.getElementById('screen-briefe').classList.add('hidden');
        document.getElementById('screen-historie').classList.add('hidden');
        document.getElementById('screen-statistik').classList.add('hidden');
        if (nav) nav.classList.add('hidden');
        return;
      }
      document.getElementById('screen-identitaet').classList.add('hidden');
      document.getElementById('user-header').classList.remove('hidden');
      document.getElementById('user-name-label').innerText = meinUser === 'leon' ? 'Leon' : 'Lotta';
      if (nav) nav.classList.remove('hidden');
      zeigeScreen('countdown');
    }

    document.getElementById('identitaet-leon-button').addEventListener('click', () => setzeIdentitaet('leon'));
    document.getElementById('identitaet-lotta-button').addEventListener('click', () => setzeIdentitaet('lotta'));
    document.getElementById('ausloggen-link').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('meinUser');
      meinUser = null;
      zeigeAppNachIdentitaet();
    });

    zeigeAppNachIdentitaet();

    // ---------- Fragen ----------
    var FRAGEN = ["Wer ist der bessere Koch?","Wer schläft länger aus?","Wer ist chaotischer?","Wer würde eine Zombie-Apokalypse länger überleben?","Wer guckt öfter aufs Handy?","Wer hat den besseren Musikgeschmack?","Wer verliert öfter Sachen?","Wer redet mehr am Telefon?","Wer kann besser einparken?","Wer isst schneller?","Wer ist morgens schlechter gelaunt?","Wer würde im Streit zuerst nachgeben?","Wer hat den schlechteren Orientierungssinn?","Wer räumt öfter auf?","Wer kann besser tanzen?","Wer würde im Urlaub eher was verlieren?","Wer ist der bessere Autofahrer?","Wer kann länger ohne Handy?","Wer motzt öfter rum?","Wer würde bei einem Quiz besser abschneiden?","Wer duscht länger?","Wer braucht länger, um sich fertig zu machen?","Wer vergisst öfter den Geburtstag von jemandem?","Wer hat mehr ungelesene Nachrichten?","Wer schnarcht lauter?","Wer klaut öfter die Bettdecke?","Wer ist der bessere Multitasker?","Wer kann Ikea-Möbel besser aufbauen?","Wer würde eher spontan verreisen?","Wer hat mehr Geduld im Stau?","Wer verlegt öfter den Schlüssel?","Wer trinkt mehr Kaffee?","Wer ist der bessere Planer?","Wer telefoniert lieber statt zu schreiben?","Wer kann besser Wegbeschreibungen erklären?","Wer hat den volleren Terminkalender?","Wer isst öfter zu spät?","Wer kann besser mit Kritik umgehen?","Wer trödelt öfter beim Rausgehen?","Wer räumt zuerst den Geschirrspüler ein?","Wer hat mehr offene Browser-Tabs?","Wer bringt öfter Süßigkeiten mit?","Wer schaut öfter Serien ohne den anderen weiter?","Wer würde eher ein Haustier anschaffen, ohne zu fragen?","Wer hat die schlechteren Ausreden?","Wer telefoniert länger mit der Familie?","Wer kann besser mit Werkzeug umgehen?","Wer bekommt öfter schlechte Laune wegen Hunger?","Wer checkt öfter das Handy beim Zähneputzen?","Wer hat mehr Klamotten im Schrank?","Wer würde sich eher ein Tattoo stechen lassen?","Wer hat als Erstes die Fernbedienung in der Hand?","Wer plant den nächsten Urlaub zuerst?","Wer kann besser kochen ohne R     function heutigesDatumSchluessel() {
      var teile = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
      var get = t => teile.find(p => p.type === t).value;
      return get('year') + '-' + get('month') + '-' + get('day');
    }
    function getTagIndex() {
      var heute = heutigesDatumSchluessel();
      var [j, m, t] = heute.split('-').map(Number);
      var jahresanfang = Date.UTC(j, 0, 1);
      var heuteUtc = Date.UTC(j, m - 1, t);
      var tagImJahr = Math.floor((heuteUtc - jahresanfang) / 86400000) + 1;
      return j * 1000 + tagImJahr;
    }

    // ---------- Optische Effekte ----------
    function zeigeKonfetti() {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      var farben = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a06cd5', '#ff9f43'];

        teil.style.left = (Math.random() * 100) + 'vw';
        teil.style.width = (6 + Math.random() * 6) + 'px';
        teil.style.height = (6 + Math.random() * 6) + 'px';
        teil.style.background = farben[Math.floor(Math.random() * farben.length)];
        teil.style.animationDelay = (Math.random() * 1.5) + 's';
        teil.style.animationDuration = (3 + Math.random() * 2) + 's';
        document.body.appendChild(teil);
        (function (el) { setTimeout(function () { el.remove(); }, 6000); })(teil);
      }
    }

    function pruefeMeilenstein(tage) {
      var zahl = document.getElementById('countdown-zahl');
      if (MEILENSTEINE.indexOf(tage) !== -1) {
        zahl.classList.add('meilenstein-zahl');

    function pruefeSpezialtag() {
      var box = document.querySelector('#screen-countdown .box');
      box.classList.remove('spezialtag-valentinstag', 'spezialtag-weihnachten', 'spezialtag-jahrestag', 'spezialtag-unterrichtsbesuch', 'wochenende');

      var heute = new Date();
      var tagMonat = heutigesDatumSchluessel().substring(5); // "MM-dd"
      var wochentag = heute.getDay();

      if (tagMonat === '02-14') { box.classList.add('spezialtag-valentinstag'); }
      else if (tagMonat === '12-24' || tagMonat === '12-25') { box.classList.add('spezialtag-weihnachten'); }
      else if (tagMonat === '12-31') { box.classList.add('spezialtag-jahrestag'); }
      else if (heutigesDatumSchluessel() === '2026-09-14') { box.classList.add('spezialtag-unterrichtsbesuch'); }
      else if (wochentag === 0 || wochentag === 6) { box.classList.add('wochenende'); }
    }

    var letzteJahreszeitenDekoBesuch = false;
    function pruefeJahreszeitenDeko() {
      if (letzteJahreszeitenDekoBesuch) return; // nur einmal pro Sitzung
      if (Math.random() >= (1 / 5)) return;
      letzteJahreszeitenDekoBesuch = true;

      var monat = new Date().getMonth() + 1;
      if (monat === 3 || monat === 4 || monat === 5) zeigeFallendePartikel(['#ffb6c1', '#ffe0ec', '#ffffff']);
      else if (monat === 6 || monat === 7 || monat === 8) zeigeFallendePartikel(['#ffd700', '#ffec8b', '#fff5b8']);
      else if (monat === 9 || monat === 10 || monat === 11) zeigeFallendePartikel(['#e67e22', '#c0392b', '#a0522d']);
      else zeigeFallendePartikel(['#ffffff'], 15);
    }

    function renderCountdown() {

      document.getElementById('fortschritt-text').innerText = prozent + '% der Wartezeit geschafft';

      var tagIndex = getTagIndex();
      document.getElementById('spruch-text').innerText = SPRUECHE[tagIndex % SPRUECHE.length];

      renderFerien();
      pruefeSpezialtag();
    }

    function renderFerien() {
      var heute = heutigesDatumSchluessel();
      var kommende = FERIEN.filter(f => f.start >= heute).sort((a,b) => a.start.localeCompare(b.start));
      if (kommende.length === 0) {
        document.getElementById('ferien-text').innerText = '';
        return;

      }
      var naechste = kommende[0];
      var startDatum = new Date(naechste.start + 'T00:00:00');

      // Beginnen die Ferien an einem Montag, ab Freitag davor zählen (Wochenende ist eh frei)
      if (startDatum.getDay() === 1) {
        startDatum.setDate(startDatum.getDate() - 3);
      }

      var diffTage = Math.ceil((startDatum - new Date()) / 86400000);
      var anzeigeDatum = naechste.start.split('-').reverse().join('.');

      if (diffTage > 0) {
        document.getElementById('ferien-text').innerText = '🎒 Noch ' + diffTage + ' Tage bis ' + naechste.name + ' (ab ' + anzeigeDatum + ')';
      } else {
        document.getElementById('ferien-text').innerText = '🎒 ' + naechste.name + ' haben begonnen!';
      }
    }

    // ---------- Abstimmung + Streak ----------
    function getFrageDesTages(tagIndex) {
      return FRAGEN[tagIndex % FRAGEN.length];
    }

    async function getStreak() {
      var snapshot = await getDocs(collection(db, 'abstimmung'));
      var vollstaendigeDaten = new Set();
      snapshot.forEach(function (docSnap) {
        var d = docSnap.data();
        if (d.leon && d.lotta) { vollstaendigeDaten.add(docSnap.id); }
      });

      var heute = heutigesDatumSchluessel();
      var pruefDatum = new Date(heute + "T00:00:00Z");
      if (!vollstaendigeDaten.has(heute)) {
        pruefDatum.setUTCDate(pruefDatum.getUTCDate() - 1);
      }
      var streak = 0;
      while (true) {
        var schluessel = pruefDatum.toISOString().substring(0, 10);
        if (!vollstaendigeDaten.has(schluessel)) break;
        streak++;
        pruefDatum.setUTCDate(pruefDatum.getUTCDate() - 1);
      }
      return streak;
    }

    function getFlammenAnzeige(streak) {
      if (streak >= 91) return { flammen: '🔥🔥🔥🔥🔥', klasse: 'streak-glow-stark' };
      if (streak >= 61) return { flammen: '🔥🔥🔥🔥', klasse: 'streak-glow-mittel' };
      if (streak >= 31) return { flammen: '🔥🔥🔥', klasse: 'streak-glow-leicht' };
      if (streak >= 15) return { flammen: '🔥🔥', klasse: '' };
      return { flammen: '🔥', klasse: '' };
    }

    var letztGefeierteFrage = null;

    async function ladeAbstimmung() {
      var container = document.getElementById('abstimmung-inhalt');
      if (anmeldungFehlgeschlagen) {
        container.innerHTML = '<p>⚠️ Verbindung zur Datenbank fehlgeschlagen.</p>';
        return;
      }
      if (!istAngemeldet) {
        container.innerHTML = '<p>Verbinde mit der Datenbank...</p>';
        return;
      }
      container.innerHTML = '<p>Lädt...</p>';

      var heute = heutigesDatumSchluessel();
      var tagIndex = getTagIndex();
      var frage = getFrageDesTages(tagIndex);
      var partner = meinUser === 'leon' ? 'lotta' : 'leon';
      var partnerName = meinUser === 'leon' ? 'Lotta' : 'Leon';

      var docRef = doc(db, 'abstimmung', heute);
      var docSnap = await getDoc(docRef);
      var daten = docSnap.exists() ? docSnap.data() : {};
      var meineStimme = daten[meinUser] || null;
      var partnerStimme = daten[partner] || null;
      var streak = await getStreak();

      renderAbstimmung(frage, meineStimme, partnerStimme, partnerName, streak, heute);
    }

    var letztGefeierterStreak = null;
    var STREAK_MEILENSTEINE = [7, 14, 30, 50, 100, 200, 365];

    function zeigeFeuerFunken() {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      zeigeAufsteigendePartikel(['#ff6b35', '#f7931e', '#ffd700', '#ff4500'], 22);
    }

    function renderAbstimmung(frage, meineStimme, partnerStimme, partnerName, streak, heute) {
      var container = document.getElementById('abstimmung-inhalt');
      var html = '';

      if (streak > 0) {
        var anzeige = getFlammenAnzeige(streak);
        html += '<p class="streak-flammen ' + anzeige.klasse + '">' + anzeige.flammen + '</p>';
        html += '<p class="streak-anzeige">' + streak + (streak === 1 ? ' Tag' : ' Tage') + ' in Folge</p>';

        if (STREAK_MEILENSTEINE.indexOf(streak) !== -1 && letztGefeierterStreak !== streak) {
          letztGefeierterStreak = streak;
          zeigeFeuerFunken();
        }
      }

      html += '<h2>' + frage + '</h2>';

      if (!meineStimme) {
        html += '<button class="frage-button" data-wahl="Leon">Leon</button>';
        html += '<button class="frage-button" data-wahl="Lotta">Lotta</button>';
      } else if (!partnerStimme) {
        html += '<p>Du hast abgestimmt: <b>' + meineStimme + '</b></p>';
        html += '<p>Warte noch auf ' + partnerName + 's Stimme...</p>';
      } else {
        var einig = meineStimme === partnerStimme;
        var meinName = meinUser === 'leon' ? 'Leon' : 'Lotta';
        html += '<p>' + meinName + ' hat abgestimmt für: <b>' + meineStimme + '</b></p>';
        html += '<p>' + partnerName + ' hat abgestimmt für: <b>' + partnerStimme + '</b></p>';
        html += '<p>' + (einig ? 'Ihr seid euch einig! 🎉' : 'Uneinigkeit 😄') + '</p>';
        if (einig && letztGefeierteFrage !== heute) {
          letztGefeierteFrage = heute;
          zeigeKonfetti();
        }
      }

      container.innerHTML = html;

      container.querySelectorAll('.frage-button').forEach(function (btn) {
        btn.addEventListener('click', function () { sendeStimme(btn.dataset.wahl, heute); });
      });
    }

    async function sendeStimme(wahl, heute) {
      var container = document.getElementById('abstimmung-inhalt');
      container.innerHTML = '<p>Speichert...</p>';

      var tagIndex = getTagIndex();
      var frage = getFrageDesTages(tagIndex);
      var docRef = doc(db, 'abstimmung', heute);
      var bestehend = await getDoc(docRef);
      var daten = bestehend.exists() ? bestehend.data() : { frage: frage };
      daten[meinUser] = wahl;
      await setDoc(docRef, daten, { merge: true });

      ladeAbstimmung();
    }

    // ---------- Historie ----------
    var MONATS_NAMEN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

    async function zeigeHistorie() {
      zeigeScreen('historie');
      var container = document.getElementById('historie-inhalt');
      container.innerHTML = '<p>Lädt...</p>';

      var snapshot = await getDocs(collection(db, 'abstimmung'));
      var eintraege = [];
      snapshot.forEach(function (docSnap) {
        var d = docSnap.data();
        if (d.leon && d.lotta) { eintraege.push({ datum: docSnap.id, frage: d.frage, leon: d.leon, lotta: d.lotta }); }
      });
      eintraege.sort(function (a, b) { return b.datum.localeCompare(a.datum); });

      if (eintraege.length === 0) {
        container.innerHTML = '<p>Noch keine gemeinsam beantworteten Fragen.</p>';
        return;
      }

      var proMonat = {};
      eintraege.forEach(function (e) {
        var monatSchluessel = e.datum.substring(0, 7);
        (proMonat[monatSchluessel] = proMonat[monatSchluessel] || []).push(e);
      });

      var html = '';
      Object.keys(proMonat).sort().reverse().forEach(function (monatSchluessel) {
        var teile = monatSchluessel.split('-');
        var monatName = MONATS_NAMEN[parseInt(teile[1], 10) - 1] + ' ' + teile[0];
        html += '<div class="historie-monat">' + monatName + ' (' + proMonat[monatSchluessel].length + ')</div>';
        proMonat[monatSchluessel].forEach(function (e) {
          var tag = e.datum.split('-')[2];
          var einig = e.leon === e.lotta;
          html += '<div class="historie-eintrag">' + tag + '.: ' + e.frage + '<br>Leon: ' + e.leon + ' | Lotta: ' + e.lotta + ' ' + (einig ? '🤝' : '😄') + '</div>';
        });
      });
      container.innerHTML = html;
    }

    document.getElementById('link-historie').addEventListener('click', zeigeHistorie);

    // ---------- Statistik ----------
    async function zeigeStatistik() {
      zeigeScreen('statistik');
      var container = document.getElementById('statistik-inhalt');
      container.innerHTML = '<p>Lädt...</p>';

      var snapshot = await getDocs(collection(db, 'abstimmung'));
      var beantwortet = 0, einigkeit = 0, uneinigkeit = 0;
      var w = { leonFuerLeon: 0, leonFuerLotta: 0, lottaFuerLeon: 0, lottaFuerLotta: 0 };

      snapshot.forEach(function (docSnap) {
        var d = docSnap.data();
        if (d.leon === 'Leon') w.leonFuerLeon++; else if (d.leon === 'Lotta') w.leonFuerLotta++;
        if (d.lotta === 'Leon') w.lottaFuerLeon++; else if (d.lotta === 'Lotta') w.lottaFuerLotta++;
        if (d.leon && d.lotta) {
          beantwortet++;
          if (d.leon === d.lotta) einigkeit++; else uneinigkeit++;
        }
      });

      var gLeonSnap = await getDoc(doc(db, 'einstellungen', 'gedankeAnzahl_leon'));
      var gLottaSnap = await getDoc(doc(db, 'einstellungen', 'gedankeAnzahl_lotta'));
      var gLeon = gLeonSnap.exists() ? (gLeonSnap.data().anzahl || 0) : 0;
      var gLotta = gLottaSnap.exists() ? (gLottaSnap.data().anzahl || 0) : 0;

      var html = '';
      if (beantwortet === 0) {
        html = '<div class="statistik-box"><p>Noch keine gemeinsam beantwortete Frage.</p></div>';
      } else {
        var prozentEinig = Math.round((einigkeit / beantwortet) * 100);
        html += '<div class="statistik-box">' +
          '<p class="statistik-titel">📊 Gemeinsam beantwortete Fragen</p>' +
          '<p class="statistik-zahl-gross">' + beantwortet + '</p>' +
          '<div class="statistik-zeile"><span>🤝 Einig</span><b>' + einigkeit + ' (' + prozentEinig + '%)</b></div>' +
          '<div class="statistik-zeile"><span>😄 Uneinig</span><b>' + uneinigkeit + '</b></div>' +
          '</div>';

        var leonGesamt = w.leonFuerLeon + w.leonFuerLotta;
        var lottaGesamt = w.lottaFuerLeon + w.lottaFuerLotta;
        if (leonGesamt > 0 || lottaGesamt > 0) {
          html += '<div class="statistik-box"><p class="statistik-titel">🗳️ Wählmuster</p>';
          if (leonGesamt > 0) {
            html += '<div class="statistik-zeile"><span>Leon → sich selbst</span><b>' + w.leonFuerLeon + 'x</b></div>' +
              '<div class="statistik-zeile"><span>Leon → Lotta</span><b>' + w.leonFuerLotta + 'x</b></div>';
          }
          if (lottaGesamt > 0) {
            html += '<div class="statistik-zeile"><span>Lotta → sich selbst</span><b>' + w.lottaFuerLotta + 'x</b></div>' +
              '<div class="statistik-zeile"><span>Lotta → Leon</span><b>' + w.lottaFuerLeon + 'x</b></div>';
          }
          html += '</div>';
        }
      }

      if (gLeon > 0 || gLotta > 0) {
        html += '<div class="statistik-box"><p class="statistik-titel">❤️ "Ich denk an dich"-Klicks</p>' +
          '<div class="statistik-zeile"><span>Leon</span><b>' + gLeon + '</b></div>' +
          '<div class="statistik-zeile"><span>Lotta</span><b>' + gLotta + '</b></div></div>';
      }

      container.innerHTML = html;
    }

    document.getElementById('link-statistik').addEventListener('click', zeigeStatistik);

    // ---------- Chat (Brief-Fach) ----------
    async function ladeBriefe() {
      if (!istAngemeldet) return;
      var container = document.getElementById('briefe-liste');
      container.innerHTML = '<p>Lädt...</p>';

      var q = query(collection(db, 'briefe'), orderBy('zeitstempel', 'asc'));
      var snapshot = await getDocs(q);

      var html = '';
      snapshot.forEach(function (docSnap) {
        var d = docSnap.data();
        var eigen = d.von === meinUser;
        var datum = new Date(d.zeitstempel);
        var zeitText = datum.toLocaleDateString('de-DE') + ' ' + datum.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        html += '<div class="brief-blase ' + (eigen ? 'brief-eigen' : 'brief-partner') + '">' +
          escapeHtml(d.text) + '<div class="brief-zeit">' + zeitText + '</div></div>';
      });

      container.innerHTML = html || '<p style="text-align:center;">Noch keine Nachrichten.</p>';
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    async function sendeBrief() {
      var eingabe = document.getElementById('brief-eingabe');
      var text = eingabe.value.trim();
      if (!text) return;

      eingabe.value = '';
      await addDoc(collection(db, 'briefe'), {
        von: meinUser,
        text: text,
        zeitstempel: Date.now()
      });
      ladeBriefe();
    }

    document.getElementById('brief-senden-button').addEventListener('click', sendeBrief);
    document.getElementById('brief-eingabe').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendeBrief();
    });

    // ---------- Ich denk an dich ----------
    var letzteGesehenGedankeZeit = 0;

    async function sendeGedanke() {
      var partnerName = meinUser === 'leon' ? 'Lotta' : 'Leon';
      await setDoc(doc(db, 'einstellungen', 'letzterGedanke'), { von: meinUser, zeit: Date.now() });

      var zaehlerRef = doc(db, 'einstellungen', 'gedankeAnzahl_' + meinUser);
      var zaehlerSnap = await getDoc(zaehlerRef);
      var bisher = zaehlerSnap.exists() ? (zaehlerSnap.data().anzahl || 0) : 0;
      await setDoc(zaehlerRef, { anzahl: bisher + 1 });

      zeigeGedankeToast('❤️ Gesendet an ' + partnerName + '!');
    }

    function zeigeGedankeToast(text) {
      var toast = document.getElementById('gedanke-toast');
      toast.innerText = text;
      toast.classList.remove('hidden');
      setTimeout(function () { toast.classList.add('hidden'); }, 4000);
    }

    async function pruefeGedanke() {
      if (!istAngemeldet || !meinUser) return;
      var snap = await getDoc(doc(db, 'einstellungen', 'letzterGedanke'));
      if (!snap.exists()) return;
      var d = snap.data();
      if (d.von !== meinUser && d.zeit > letzteGesehenGedankeZeit) {
        var partnerName = meinUser === 'leon' ? 'Lotta' : 'Leon';
        zeigeGedankeToast('❤️ ' + partnerName + ' denkt gerade an dich');
      }
      letzteGesehenGedankeZeit = Math.max(letzteGesehenGedankeZeit, d.zeit);
    }

    document.getElementById('gedanke-button').addEventListener('click', sendeGedanke);
    setInterval(pruefeGedanke, 30000);

    // ---------- Online-Status ----------
    async function sendeHerzschlag() {
      if (!istAngemeldet || !meinUser) return;
      await setDoc(doc(db, 'einstellungen', 'zuletztAktiv_' + meinUser), { zeit: Date.now() });
    }

    async function pruefeOnlineStatus() {
      if (!istAngemeldet || !meinUser) return;
      var partner = meinUser === 'leon' ? 'lotta' : 'leon';
      var partnerName = meinUser === 'leon' ? 'Lotta' : 'Leon';
      var snap = await getDoc(doc(db, 'einstellungen', 'zuletztAktiv_' + partner));
      var anzeige = document.getElementById('online-status');
      if (snap.exists() && (Date.now() - snap.data().zeit) < 60000) {
        anzeige.innerText = '🟢 ' + partnerName + ' ist gerade auch da';
        anzeige.classList.remove('hidden');
      } else {
        anzeige.classList.add('hidden');
      }
    }

    setInterval(function () { sendeHerzschlag(); pruefeOnlineStatus(); }, 30000);

    // ---------- Navigation ----------
    function zeigeScreen(name) {
      ['countdown', 'abstimmung', 'briefe', 'historie', 'statistik'].forEach(function (n) {
        document.getElementById('screen-' + n).classList.toggle('hidden', n !== name);
        var navItem = document.getElementById('nav-' + n);
        if (navItem) navItem.classList.toggle('aktiv', n === name || (name === 'historie' && n === 'abstimmung') || (name === 'statistik' && n === 'abstimmung'));
      });
    }
    document.getElementById('nav-countdown').addEventListener('click', () => zeigeScreen('countdown'));
    document.getElementById('nav-abstimmung').addEventListener('click', () => { zeigeScreen('abstimmung'); ladeAbstimmung(); });
    document.getElementById('nav-briefe').addEventListener('click', () => { zeigeScreen('briefe'); ladeBriefe(); });

    // ---------- Dark/Light/System-Modus ----------
    var farbModi = ['system', 'light', 'dark'];
    var aktuellerModus = localStorage.getItem('farbmodus') || 'system';

    function wendeFarbmodusAn() {
      var istDunkel = aktuellerModus === 'dark' ||
        (aktuellerModus === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.classList.toggle('dark', istDunkel);
      var icons = { system: '🖥️', light: '☀️', dark: '🌙' };
      document.getElementById('modus-button').innerText = icons[aktuellerModus];
    }
    document.getElementById('modus-button').addEventListener('click', function () {
      var index = farbModi.indexOf(aktuellerModus);
      aktuellerModus = farbModi[(index + 1) % farbModi.length];
      localStorage.setItem('farbmodus', aktuellerModus);
      wendeFarbmodusAn();
    });

    // ---------- Start ----------
    wendeFarbmodusAn();
    renderCountdown();
    pruefeJahreszeitenDeko();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function (e) {
        console.error('Service Worker Registrierung fehlgeschlagen:', e);
      });
    }
    setInterval(renderCountdown, 60000); // jede Minute neu berechnen
  </script>
</body>
</html>
