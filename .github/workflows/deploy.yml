name: Zu Firebase Hosting bereitstellen

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Firebase-Zugangsschlüssel schreiben
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: Firestore-Regeln bereitstellen
        id: deploy-rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: firebase deploy --only firestore:rules --project osnacountdown --non-interactive 2>&1 | tee /tmp/rules-log.txt

      - name: Hosting bereitstellen
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: firebase deploy --only hosting --project osnacountdown --non-interactive 2>&1 | tee /tmp/deploy-log.txt

      - name: Protokoll sichern (nur falls nötig zum Nachschauen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: /tmp/deploy-log.txt
